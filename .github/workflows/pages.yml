name: Publish Glenolia website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node integrations/build-admin.mjs
      - run: node --test integrations/newsletter.test.mjs integrations/admin.test.mjs integrations/owner-notifications.test.mjs integrations/programme-store.test.mjs integrations/programme-api.test.mjs src/progress/programme-time.test.mjs
      - run: python scripts/build.py
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
      - run: npm run build:progress
      - run: python scripts/audit.py
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
      - run: python scripts/audit-progress.py
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
      - run: python scripts/audit-programmes.py
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
