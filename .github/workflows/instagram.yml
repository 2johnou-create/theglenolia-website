name: Refresh authorised Instagram feed
on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: instagram
  cancel-in-progress: false
jobs:
  import:
    if: vars.INSTAGRAM_FEED_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=12.0,<13'
      - run: python scripts/sync_instagram.py
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
      - name: Save changed feed and rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/instagram.json public/assets/instagram
          if ! git diff --cached --quiet; then
            git config user.name 'Glenolia website'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh authorised Instagram posts'
            git push
            gh workflow run pages.yml
          fi
